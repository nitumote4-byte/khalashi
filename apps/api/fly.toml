# Fly.io app config for Khalashi API.
# Prerequisites: fly auth login, fly apps create khalashi-api, attach Postgres
#   fly postgres create --name khalashi-db
#   fly postgres attach khalashi-db -a khalashi-api
# Then: fly deploy (from apps/api). Migrations run via docker-entrypoint.sh.
# Soft-launch: OTP_PROVIDER=mock (set secrets with fly secrets set).

app = "khalashi-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  OTP_PROVIDER = "mock"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
