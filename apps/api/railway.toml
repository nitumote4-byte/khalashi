# Railway service config for apps/api (set root directory to apps/api in dashboard,
# or deploy with: railway up --service khalashi-api from this folder).
# Add a Railway Postgres plugin and link DATABASE_URL automatically.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
