name: khalashi
description: Khalashi — India carpool (trip post + seat book, cash on trip).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  # 4.x raises geocoding_android compileSdk to 35+ (3.x pinned 33).
  geocoding: ^4.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
