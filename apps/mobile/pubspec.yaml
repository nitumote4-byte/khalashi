name: khalashi
description: Khalashi — India carpool (trip post + seat book, cash on trip).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.2
  shared_preferences: ^2.3.3
  geolocator: ^13.0.2
  # 4.x raises geocoding_android compileSdk to 35+ (3.x pinned 33).
  geocoding: ^4.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Soft-launch ID verification: camera capture + optional on-device OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0
  # SOS: dial emergency contact / 112 + system share sheet
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
