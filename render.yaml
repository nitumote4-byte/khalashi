# Render Blueprint — deploy Khalashi API + Postgres from this repo.
# Dashboard: New → Blueprint → select nitumote4-byte/khalashi
# Or: render blueprints apply (requires RENDER_API_KEY).
# Soft-launch default: OTP_PROVIDER=mock (no MSG91/DLT yet).

databases:
  - name: khalashi-db
    plan: free
    databaseName: khalashi
    user: khalashi

services:
  - type: web
    name: khalashi-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OTP_PROVIDER
        value: mock
      - key: OTP_MOCK_CODE
        value: "123456"
      - key: DATABASE_URL
        fromDatabase:
          name: khalashi-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # Do not set MSG91_* until India DLT + MSG91 templates are ready.
